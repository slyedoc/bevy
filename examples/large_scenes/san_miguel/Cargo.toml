[package]
name = "san_miguel"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { path = "../../../", features = [
  "bevy_camera_controller",
  "free_camera",
  "bevy_feathers",
  "bevy_dev_tools",
  # Transcode the GLB's ETC1S/UASTC KTX2 textures (KHR_texture_basisu) to BC7
  # on the GPU. Without it the basisu textures fail to load. `ktx2` + `zstd_rust`
  # are already in bevy's default 3D feature set.
  "basis-universal",
] }
mipmap_generator = { path = "../mipmap_generator" }

argh = "0.1.12"

[features]

default = ["debug_text", "solari"]
debug_text = ["bevy/bevy_ui"]
# Full ray-traced rendering via bevy_solari (PbrPlugin disabled). Mirrors the
# bevy_city `solari` feature; `cluster_processor` gates the mesh→ClusterMesh
# conversion helpers in `bevy_solari::prelude`.
solari = [
  "bevy/bevy_solari",
  "bevy/cluster_processor",  
  "bevy/bevy_solari_debug",
]
dlss = ["bevy/dlss"]
pbr_transmission_textures = ["bevy/pbr_transmission_textures"]
pbr_multi_layer_material_textures = ["bevy/pbr_multi_layer_material_textures"]
pbr_anisotropy_texture = ["bevy/pbr_anisotropy_texture"]
pbr_specular_textures = ["bevy/pbr_specular_textures"]
