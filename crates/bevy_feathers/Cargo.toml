[package]
name = "bevy_feathers"
version = "0.20.0-dev"
edition = "2024"
description = "A collection of UI widgets for building editors and utilities in Bevy"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_a11y = { path = "../bevy_a11y", version = "0.20.0-dev" }
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0-dev" }
bevy_color = { path = "../bevy_color", version = "0.20.0-dev" }
bevy_ui_widgets = { path = "../bevy_ui_widgets", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_input = { path = "../bevy_input", version = "0.20.0-dev" }
bevy_input_focus = { path = "../bevy_input_focus", version = "0.20.0-dev" }
bevy_log = { path = "../bevy_log", version = "0.20.0-dev" }
bevy_math = { path = "../bevy_math", version = "0.20.0-dev" }
bevy_picking = { path = "../bevy_picking", version = "0.20.0-dev" }
bevy_shader = { path = "../bevy_shader", version = "0.20.0-dev", optional = true }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev", optional = true }
bevy_scene = { path = "../bevy_scene", version = "0.20.0-dev" }
bevy_text = { path = "../bevy_text", version = "0.20.0-dev" }
bevy_ui = { path = "../bevy_ui", version = "0.20.0-dev", features = [
  "bevy_picking",
] }
bevy_ui_render = { path = "../bevy_ui_render", version = "0.20.0-dev", optional = true }
bevy_window = { path = "../bevy_window", version = "0.20.0-dev" }
bevy_derive = { path = "../bevy_derive", version = "0.20.0-dev" }
smol_str = { version = "0.2", default-features = false }

# other
accesskit = "0.24"

[dev-dependencies]
bevy_image = { path = "../bevy_image", version = "0.20.0-dev" }
bevy_time = { path = "../bevy_time", version = "0.20.0-dev" }

[features]
default = ["render_materials"]
custom_cursor = ["bevy_window/custom_cursor"]

# The parts of feathers that need a `bevy_render`-based renderer: the
# checkerboard alpha-pattern `UiMaterial` behind color swatches / sliders, and
# the `color_plane` control (a 2D color-picker plane drawn by a WGSL shader).
#
# Turning this off drops `bevy_render`, `bevy_shader` and `bevy_ui_render` from
# the dependency graph entirely, so themes, layout, and every non-material
# control can be used on top of a custom render backend. Enabled by default, so
# a plain `bevy_feathers` build is unchanged.
render_materials = ["dep:bevy_render", "dep:bevy_shader", "dep:bevy_ui_render"]

# Consumed only by the `render_materials` half (the `color_plane` uniform
# padding); inert on their own so that the `webgl`/`webgpu` fan-out in
# `bevy_internal` does not force the render half back on.
webgl = []
webgpu = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
