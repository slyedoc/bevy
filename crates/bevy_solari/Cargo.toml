[package]
name = "bevy_solari"
version = "0.20.0-dev"
edition = "2024"
description = "Provides raytraced lighting for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]


[features]
# Floating-origin cell precision (mirrors `big_space`'s `GridPrecision`): the integer
# width [`SolariGridCell`]/[`SolariFloatingOrigin`] store per axis. Default `i32` (lean —
# 12 B/cell, ~solar-system range at km cells). Opt into a wider type to manage range vs
# memory. The GPU is unaffected (it only uses the camera-relative low word); a wider
# scalar just extends the absolute range you can place geometry at. `grid_i128` wins over
# `grid_i64` if both are set.
grid_i64 = []
grid_i128 = []
force_disable_dlss = ["bevy_anti_alias/force_disable_dlss"]
# Enables baking `bevy_mesh::Mesh` into `ClusterMesh` via
# `ClusterMesh::from_mesh`. Pulls in `meshopt` (C library) — offline
# tools only; runtime crates do not need this feature.
cluster_processor = ["dep:meshopt"]
# Emits `SolariMaterial` from glTF materials at load (a `GltfExtensionHandler`),
# so glTF scenes get real materials with `PbrPlugin` (and its glTF→StandardMaterial
# handler) disabled. Threaded from bevy via `bevy_gltf = [..., "bevy_solari?/gltf"]`.
gltf = ["dep:bevy_gltf", "dep:serde_json"]
# Enables the in-engine debug-view dropdown (`SolariDebugPlugin`) and the
# reusable camera CLI (`cli::SolariCameraArgs`, a flattenable `clap::Args`
# block carrying the furnace estimator levers). Pulls in bevy_feathers +
# the UI widget stack + clap — examples / tools only; runtime games
# typically don't want this.
bevy_solari_debug = [
  "dep:clap",
  "dep:bevy_dev_tools",
  "dep:bevy_feathers",
  "dep:bevy_feathers_inspector",
  "dep:bevy_input",
  "dep:bevy_input_focus",
  "dep:bevy_scene",
  "dep:bevy_text",
  "dep:bevy_ui_widgets",
  "dep:serde",
  "dep:ron",
]

[dependencies]
# bevy
# DLSS is unconditional: this stack is NVIDIA-only (raw-VK NV cluster AS),
# and recipe behavior under DLSS RR is what any meaningful test measures.
# bevy_anti_alias/dlss supplies DlssInitPlugin's Vulkan extension registration
# + DlssProjectId; dlss_wgpu is driven directly for prepass-free RR.
bevy_anti_alias = { path = "../bevy_anti_alias", version = "0.20.0-dev", features = ["dlss"] }
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0-dev" }
bevy_color = { path = "../bevy_color", version = "0.20.0-dev" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.20.0-dev" }
bevy_derive = { path = "../bevy_derive", version = "0.20.0-dev" }
bevy_diagnostic = { path = "../bevy_diagnostic", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_gltf = { path = "../bevy_gltf", version = "0.20.0-dev", optional = true }
bevy_shader = { path = "../bevy_shader", version = "0.20.0-dev" }
bevy_material = { path = "../bevy_material", version = "0.20.0-dev" }
# transform_f64: solari's floating origin IS the f64 Transform — the whole build
# switches to double-precision transforms when bevy_solari is enabled.
bevy_math = { path = "../bevy_math", version = "0.20.0-dev", features = [
  "transform_f64",
] }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0-dev" }
bevy_light = { path = "../bevy_light", version = "0.20.0-dev" }
bevy_pbr = { path = "../bevy_pbr", version = "0.20.0-dev", features = [
  "dfg_lut",
] }
bevy_picking = { path = "../bevy_picking", version = "0.20.0-dev" }
bevy_post_process = { path = "../bevy_post_process", version = "0.20.0-dev" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev", features = [
  # bevy_solari is Vulkan-only (NV cluster-AS / partitioned-AS runtime
  # uses ash + as_hal_mut). raw_vulkan_init pulls in `wgpu/vulkan` +
  # the RawVulkanInitSettings hook the cluster runtime needs.
  "raw_vulkan_init",
] }
bevy_image = { path = "../bevy_image", version = "0.20.0-dev", features = [
  "zstd_rust"
] }
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0-dev" }
# Render-world `Time` (extracted by bevy_render's globals) — feeds RtCamera.misc.x
# so hit shaders can animate (ocean waves, gas-giant bands).
bevy_time = { path = "../bevy_time", version = "0.20.0-dev" }
bevy_utils = { path = "../bevy_utils", version = "0.20.0-dev" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0-dev", features = [
  "transform_f64",
] }
# Optional — only pulled in by the `bevy_solari_debug` feature for the
# in-engine debug-view dropdowns (Solari overlay + bevy render debug).
bevy_dev_tools = { path = "../bevy_dev_tools", version = "0.20.0-dev", optional = true }
bevy_feathers = { path = "../bevy_feathers", version = "0.20.0-dev", optional = true }
bevy_feathers_inspector = { path = "../bevy_feathers_inspector", version = "0.20.0-dev", optional = true }
bevy_input = { path = "../bevy_input", version = "0.20.0-dev", optional = true }
bevy_input_focus = { path = "../bevy_input_focus", version = "0.20.0-dev", optional = true }
bevy_scene = { path = "../bevy_scene", version = "0.20.0-dev", optional = true }
bevy_text = { path = "../bevy_text", version = "0.20.0-dev", optional = true }
bevy_ui = { path = "../bevy_ui", version = "0.20.0-dev" }
bevy_ui_widgets = { path = "../bevy_ui_widgets", version = "0.20.0-dev", optional = true }
bevy_log = { path = "../bevy_log", version = "0.20.0-dev" }

# other
# Direct ash + wgpu deps for the cluster runtime's
# `as_hal_mut::<vulkan::Api>` + NV cluster-AS / partitioned-AS path.
# bevy_solari assumes Vulkan, matching DLSS's policy (Vulkan-only
# today, mirroring whatever bevy does for DLSS+DX12 when that lands).
ash = { version = "0.38", features = ["provisional"] }
wgpu = { version = "29.0.3", default-features = false }
# Optional — only pulled in by `bevy_solari_debug` (`cli::SolariCameraArgs`).
clap = { version = "4", features = ["derive"], optional = true }
# Shader composition for the raw-VK RT-pipeline shaders: they `#import` solari's
# scene-binding / BRDF / sampling modules, which need naga_oil's composer (raw
# naga::parse_str can't resolve `#import`). Patched to the SER-aware fork.
naga_oil = { version = "0.22", default-features = false }
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
# Runtime Slang→SPIR-V for the RT stages that compose runtime-swappable
# modules (the primary miss's custom sky, downstream Slang closest-hits):
# libslang.so is dlopen'd from the pinned toolchain (see `gpu/slang.rs`).
libloading = "0.8"
# DLSS Ray Reconstruction for the `restir` path — used directly (not via
# bevy_anti_alias's `Dlss` component) so the self-contained RT path needs no
# raster prepass.
dlss_wgpu = { version = "4.0.0" }
serde_json = { version = "1.0.140", optional = true }
# The camera config wire format (--camera RON round-trip, debug tooling).
serde = { version = "1", features = ["derive"], optional = true }
ron = { version = "0.12", optional = true }
bitflags = { version = "2" }
bytemuck = { version = "1" }
# Harness dumps (`SolariFreezeDiff`): the accumulated output buffer is written
# as OpenEXR for offline FLIP/RMSE grading.
exr = "1.74"
half = { version = "2" }
derive_more = { version = "2", default-features = false, features = ["display", "from"] }
lz4_flex = { version = "0.13", default-features = false, features = ["std", "frame"] }
meshopt = { version = "0.6.2", optional = true }
range-alloc = "0.1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
wgpu-types = { version = "29.0.3", default-features = false }


[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
